[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aznovel"
version = "0.1.0"
description = "AI-assisted Chinese web novel writing CLI tool"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
aznovel = "aznovel.app:main"

[tool.setuptools.packages.find]
include = ["aznovel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
